<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte QR — {{ machine.display_name }}</title>
<style>
  /* Apron card format — slips into the pinball machine card holder. */
  @page { size: 114mm 62mm; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root { --brand: #156082; }
  body {
    width: 114mm; height: 62mm;
    font-family: "Helvetica", "Arial", sans-serif;
    color: #1f2937;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .top-bar { height: 2.2mm; background: var(--brand); }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 3mm 5mm 2mm;
    gap: 2mm;
    text-align: center;
  }
  .head { display: flex; align-items: center; justify-content: center; gap: 2.5mm; }
  .head img { height: 9mm; width: auto; }
  .assoc { font-size: 10.5pt; font-weight: 700; line-height: 1.1; color: var(--brand); }
  .message { font-size: 7.5pt; line-height: 1.3; margin: 0; color: #374151; max-width: 95mm; }
  .qr-row { display: flex; gap: 7mm; }
  .qr-col { text-align: center; }
  .qr-col .box {
    border: 0.4mm solid var(--brand); border-radius: 2mm; padding: 1.5mm;
    display: inline-block; background: #fff;
  }
  .qr-col img { width: 25mm; height: 25mm; display: block; }
  .qr-col .label { font-size: 8pt; font-weight: 700; margin-top: 1.5mm; color: var(--brand); }
  .qr-col .sub { font-size: 6.5pt; color: #6b7280; line-height: 1.2; }
  .machine {
    text-align: center;
    font-size: 5.5pt; color: #9ca3af;
    padding-bottom: 1.5mm;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="content">
    <div class="head">
      {% if logo_data %}<img src="data:image/png;base64,{{ logo_data }}" alt="">{% endif %}
      <div class="assoc">{{ cfg.name or "Des Lumières Dans Les Yeux" }}</div>
    </div>

    <p class="message">{{ message }}</p>

    <div class="qr-row">
      <div class="qr-col">
        <span class="box"><img src="data:image/svg+xml;base64,{{ breakdown_qr }}" alt=""></span>
        <div class="label">Signaler une panne</div>
        <div class="sub">Ce flipper ne fonctionne pas&nbsp;?</div>
      </div>
      <div class="qr-col">
        <span class="box"><img src="data:image/svg+xml;base64,{{ feedback_qr }}" alt=""></span>
        <div class="label">Livre d'or</div>
        <div class="sub">Laissez-nous un petit mot&nbsp;!</div>
      </div>
    </div>
  </div>

  <div class="machine">
    {{ machine.display_name }}{% if machine.internal_number %} · n°{{ machine.internal_number }}{% endif %}
  </div>
</body>
</html>
