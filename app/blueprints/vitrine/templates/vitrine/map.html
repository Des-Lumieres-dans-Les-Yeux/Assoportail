<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte des centres - Assoportail</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style nonce="{{ csp_nonce() }}">
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        #map { height: 100%; width: 100%; }
        .popup-content { font-family: sans-serif; min-width: 150px; }
        .popup-title { font-weight: bold; font-size: 1.1em; color: #1e40af; margin-bottom: 4px; }
        .popup-city { color: #64748b; font-size: 0.9em; margin-bottom: 8px; }
        .popup-badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .popup-link { margin-top: 8px; font-size: 0.85em; }
        .popup-link a { color: #1e40af; font-weight: 600; text-decoration: none; }
        .popup-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script nonce="{{ csp_nonce() }}">
        const map = L.map('map', {
            scrollWheelZoom: false // Désactivé pour faciliter la navigation dans WordPress
        }).setView([48.3, 7.5], 8); // Centré sur l'Alsace

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Les champs des centres sont des données non fiables (saisies par
        // des membres) : échappement HTML systématique, aucun HTML brut.
        function esc(value) {
            const span = document.createElement('span');
            span.textContent = value == null ? '' : String(value);
            return span.innerHTML;
        }

        // Lien web : uniquement http(s) (pas de javascript: ni relatif).
        function safeHttpUrl(value) {
            return typeof value === 'string' && /^https?:\/\//i.test(value) ? value : null;
        }

        const centers = {{ centers_data | tojson }};
        const markers = [];

        centers.forEach(center => {
            if (center.lat && center.lng) {
                const marker = L.marker([center.lat, center.lng]).addTo(map);

                const installLink = safeHttpUrl(center.web_link);
                const centerLink = safeHttpUrl(center.blog_link);
                const meta = [];
                if (center.pathology) {
                    meta.push('🩺 ' + center.pathology.charAt(0).toUpperCase() + center.pathology.slice(1));
                }
                if (center.target_audience) {
                    meta.push('👥 ' + center.target_audience.charAt(0).toUpperCase() + center.target_audience.slice(1));
                }

                const popupHtml = `
                    <div class="popup-content">
                        <div class="popup-title">${esc(center.name)}</div>
                        <div class="popup-city">${esc(center.city)} (${esc(center.zip_code)})</div>
                        ${meta.length ? `<div style="font-size: 0.85em; color: #475569; margin-bottom: 8px;">${esc(meta.join(' • '))}</div>` : ''}
                        <div class="popup-badge">🕹️ ${esc(center.machine_name)}</div>
                        ${installLink ? `<div class="popup-link"><a href="${esc(installLink)}" target="_blank" rel="noopener">📝 Billet du blog</a></div>` : ''}
                        ${centerLink ? `<div class="popup-link"><a href="${esc(centerLink)}" target="_blank" rel="noopener">🔗 Lien web du centre</a></div>` : ''}
                    </div>
                `;
                
                marker.bindPopup(popupHtml, {
                    closeButton: false,
                    offset: L.point(0, -20)
                });

                // Aperçu au survol seulement quand aucune bulle n'est ouverte :
                // une bulle ouverte reste stable et son lien reste cliquable.
                marker.on('mouseover', function() {
                    if (!map._popup) this.openPopup();
                });

                // Clic : bulle stable et lien cliquable. Le clic par défaut de Leaflet
                // referme une bulle déjà ouverte (toggle) ; on la rouvre à chaque clic.
                marker.on('click', function() {
                    this.openPopup();
                });
                
                markers.push(marker);
            }
        });

        if (markers.length > 0) {
            const group = new L.featureGroup(markers);
            map.fitBounds(group.getBounds().pad(0.2));
        }

        // Robust iframe sizing: only fitBounds once valid dimensions are known.
        let fitted = false;

        function fitMap() {
            if (fitted || markers.length === 0) return;
            const size = map.getSize();
            if (size.x > 0 && size.y > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.2));
                fitted = true;
            }
        }

        window.addEventListener('resize', function() {
            map.invalidateSize();
            fitMap();
        });

        [100, 500, 1500].forEach(function(delay) {
            setTimeout(function() { map.invalidateSize(); fitMap(); }, delay);
        });

        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(function() { map.invalidateSize(); fitMap(); })
                .observe(document.getElementById('map'));
        }
    </script>
</body>
</html>
